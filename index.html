<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZALAM STORE</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; text-align: center; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; text-decoration: none; display: block; }
        .btn-check { background-color: #3498db; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; display: block; text-decoration: none; }
        .btn-check:hover { background-color: #2980b9; }
        .btn-copy { background-color: #2ecc71; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .invoice-box { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 14px; }
        optgroup { font-weight: bold; color: #e74c3c; background: #fff; }
        option { color: #333; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <!-- 🔥 تم تعديل العنوان للأبد بناءً على طلبك ليصبح بالإنجليزي الفخم -->
    <h2>🎮 ZALAM STORE</h2>
    <p>أدخل معرّف اللاعب (ID) واختر باقة اللعبة المفضلة لديك</p>

    <div class="input-group">
        <label for="playerId">معرّف اللاعب الحقيقي (Player ID):</label>
        <input type="number" id="playerId" placeholder="أدخل الـ ID الخاص باللعبة هنا" required>
        <button class="btn-check" onclick="checkPlayerNickname()">🔍 فحص والتحقق من اسم الحساب (Nickname)</button>
    </div>

    <div class="input-group">
        <label for="serviceSelect">اختر باقة الشحن الرقمية:</label>
        <select id="serviceSelect">
            <optgroup label="🔥 جواهر فري فاير (Free Fire)">
                <option value="💎 110 جواهر فري فاير بسعر 1.50$ 🟢">💎 110 جوهرة ($1.50)</option>
                <option value="💎 231 جواهر فري فاير بسعر 2.80$ 🟢">💎 231 جوهرة ($2.80)</option>
                <option value="💎 583 جواهر فري فاير بسعر 6.00$ 🟢">💎 583 جوهرة ($6.00)</option>
                <option value="💎 1188 جواهر فري فاير بسعر 11.50$ 🟢">💎 1188 جوهرة ($11.50)</option>
                <option value="💎 2420 جواهر فري فاير بسعر 22.00$ 🟢">💎 2420 جوهرة ($22.00)</option>
            </optgroup>
            <optgroup label="🎯 شدات ببجي موبايل (PUBG UC)">
                <option value="🪙 60 شدة ببجي UC بسعر 1.30$ 🟢">🪙 60 شدة UC ($1.30)</option>
                <option value="🪙 325 شدة ببجي UC بسعر 5.20$ 🟢">🪙 325 شدة UC ($5.20)</option>
                <option value="🪙 660 شدة ببجي UC بسعر 9.90$ 🟢">🪙 660 شدة UC ($9.90)</option>
                <option value="🪙 1800 شدة ببجي UC بسعر 24.50$ 🟢">🪙 1800 شدة UC ($24.50)</option>
                <option value="🪙 3850 شدة ببجي UC بسعر 48.00$ 🟢">🪙 3850 شدة UC ($48.00)</option>
            </optgroup>
        </select>
    </div>

    <button class="btn-submit" onclick="generateInvoice()">📦 تأكيد الطلب وعرض الفاتورة</button>

    <div id="invoiceBox" class="invoice-box">
        <h3 style="text-align:center; margin-top:0; color: #e74c3c;">🧾 فاتورة الدفع الرسمية الموحدة</h3>
        <p id="invoiceDetails"></p>
        <button class="btn-copy" onclick="copyInvoiceText()">📋 نسخ تفاصيل الفاتورة بالكامل</button>
        <hr>
        <p style="color:#c0392b; font-weight:bold; text-align:center; font-size: 13px;">⚠️ يرجى الضغط على زر النسخ الأخضر أعلاه، وإرسال النص في شات البوت مع صورة إيصال التحويل المالي ليتم شحن حسابك فوراً! 💸</p>
    </div>
</div>

<script>
    var textToCopy = ""; 
    
    function checkPlayerNickname() {
        var id = document.getElementById('playerId').value.trim();
        var selectedPackage = document.getElementById('serviceSelect').value;
        if (!id) { alert('الرجاء إدخال معرّف اللاعب (ID) أولاً ليتم فصحه!'); return; }
        if (selectedPackage.includes("ببجي") || selectedPackage.includes("شدة") || selectedPackage.includes("UC")) {
            window.open("https://scrims.me", '_blank');
        } else {
            window.open("https://redxgame.com", '_blank');
        }
    }

    function generateInvoice() {
        var id = document.getElementById('playerId').value.trim();
        var packageText = document.getElementById('serviceSelect').value;
        if (!id) { alert('الرجاء إدخال معرّف اللاعب (ID) أولاً!'); return; }
        var walletAddress = "94046e6860d4ba8897e918b5e9fed55e";
        document.getElementById('invoiceDetails').innerHTML = "🆔 <b>معرّف اللاعب (ID):</b> " + id + "<br>📦 <b>الباقة واللعبة المطلوبة:</b> " + packageText + "<br>💳 <b>حساب استلام المدفوعات:</b><br>👉 <code>" + walletAddress + "</code>";
        textToCopy = "🧾 فاتورة طلب شحن جديدة\n" + "🆔 معرّف اللاعب (ID): " + id + "\n" + "📦 اللعبة والباقة: " + packageText + "\n" + "💳 حساب استلام الأرباح للتحويل: " + walletAddress;
        document.getElementById('invoiceBox').style.display = 'block';
    }

    function copyInvoiceText() {
        if (!textToCopy) return;
        var dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = textToCopy;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        alert("✅ تم نسخ تفاصيل الفاتورة بنجاح! الصقها الآن في شات البوت وأرسلها مع صورة التحويل.");
    }
</script>

</body>
</html>
