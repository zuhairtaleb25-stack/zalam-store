<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن جواهر فري فاير</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; text-align: center; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; text-decoration: none; display: block; }
        .invoice-box { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💎 متجر شحن فري فاير المباشر</h2>
    <p>أدخل بياناتك واختر باقة الجواهر لعرض فاتورة التحويل</p>

    <div class="input-group">
        <label for="playerId">معرّف اللاعب (Player ID):</label>
        <input type="number" id="playerId" placeholder="أدخل الـ ID الخاص بك هنا" required>
    </div>

    <div class="input-group">
        <label for="serviceSelect">اختر باقة الجواهر:</label>
        <select id="serviceSelect">
            <option value="💎 110 جوهرة بسعر 1.20$ 🟢">💎 110 جوهرة ($1.20)</option>
            <option value="💎 231 جوهرة بسعر 2.40$ 🟢">💎 231 جوهرة ($2.40)</option>
            <option value="💎 583 جوهرة بسعر 5.50$ 🟢">💎 583 جوهرة ($5.50)</option>
            <option value="💎 1188 جوهرة بسعر 10.90$ 🟢">💎 1188 جوهرة ($10.90)</option>
            <option value="💎 2420 جوهرة بسعر 21.50$ 🟢">💎 2420 جوهرة ($21.50)</option>
        </select>
    </div>

    <button class="btn-submit" onclick="generateInvoice()">📦 تأكيد الطلب وعرض الفاتورة</button>

    <!-- صندوق عرض الفاتورة الفوري ببيانات حسابك المشفر الجديد -->
    <div id="invoiceBox" class="invoice-box">
        <h3 style="text-align:center; margin-top:0; color: #e74c3c;">🧾 فاتورة الدفع الرسمية</h3>
        <p id="invoiceDetails"></p>
        <hr>
        <p style="color:#c0392b; font-weight:bold; text-align:center; font-size: 13px;">يرجى تصوير الشاشة (أو نسخ البيانات) وإرسالها في محادثة البوت لتأكيد طلبك وتفعيل الشحن فوراً!</p>
    </div>
</div>

<script>
    function generateInvoice() {
        var id = document.getElementById('playerId').value.trim();
        var packageText = document.getElementById('serviceSelect').value;

        if (!id) {
            alert('الرجاء إدخال معرّف اللاعب (ID) أولاً!');
            return;
        }

        // تم تثبيت حسابك المالي المعتمد بنجاح كامل لمنع الأخطاء التقليدية
        document.getElementById('invoiceDetails').innerHTML = 
            "🆔 <b>معرّف اللاعب (ID):</b> " + id + "<br>" +
            "📦 <b>الباقة المطلوبة:</b> " + packageText + "<br>" +
            "💳 <b>حساب الكاش لاستلام الأرباح:</b><br>" +
            "👉 <code>94046e6860d4ba8897e918b5e9fed55e</code>";
            
        document.getElementById('invoiceBox').style.display = 'block';
    }
</script>

</body>
</html>
