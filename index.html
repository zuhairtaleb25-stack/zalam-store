<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن جواهر فري فاير</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; text-align: center; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; text-decoration: none; display: block; }
        .btn-copy { background-color: #2ecc71; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-copy:hover { background-color: #27ae60; }
        .invoice-box { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💎 متجر شحن فري فاير المباشر</h2>
    <p>أدخل بياناتك واختر باقة الجواهر لعرض فاتورة التحويل</p>

    <div class="input-group">
        <label for="playerId">معرّف اللاعب (Player ID):</label>
        <input type="number" id="playerId" placeholder="أدخل الـ ID الخاص بك هنا" required>
    </div>

    <div class="input-group">
        <label for="serviceSelect">اختر باقة الجواهر:</label>
        <select id="serviceSelect">
            <option value="💎 110 جوهرة بسعر 1.50$ 🟢">💎 110 جوهرة ($1.50)</option>
            <option value="💎 231 جوهرة بسعر 2.80$ 🟢">💎 231 جوهرة ($2.80)</option>
            <option value="💎 583 جوهرة بسعر 6.00$ 🟢">💎 583 جوهرة ($6.00)</option>
            <option value="💎 1188 جوهرة بسعر 11.50$ 🟢">💎 1188 جوهرة ($11.50)</option>
            <option value="💎 2420 جوهرة بسعر 22.00$ 🟢">💎 2420 جوهرة ($22.00)</option>
        </select>
    </div>

    <button class="btn-submit" onclick="generateInvoice()">📦 تأكيد الطلب وعرض الفاتورة</button>

    <div id="invoiceBox" class="invoice-box">
        <h3 style="text-align:center; margin-top:0; color: #e74c3c;">🧾 فاتورة الدفع الرسمية</h3>
        <p id="invoiceDetails"></p>
        
        <!-- زر النسخ التلقائي السحري للزبائن -->
        <button class="btn-copy" onclick="copyInvoiceText()">📋 نسخ تفاصيل الفاتورة بالكامل</button>
        
        <hr>
        <p style="color:#c0392b; font-weight:bold; text-align:center; font-size: 13px;">⚠️ يرجى الضغط على زر النسخ الأخضر أعلاه، وإرسال النص في شات البوت مع صورة إيصال التحويل المالي ليتم الشحن فوراً! 💸</p>
    </div>
</div>

<script>
    var textToCopy = ""; // متغير لتخزين النص النظيف المخصص للنسخ

    function generateInvoice() {
        var id = document.getElementById('playerId').value.trim();
        var packageText = document.getElementById('serviceSelect').value;

        if (!id) {
            alert('الرجاء إدخال معرّف اللاعب (ID) أولاً!');
            return;
        }

        var walletAddress = "94046e6860d4ba8897e918b5e9fed55e";

        // عرض النص منسقاً داخل الواجهة للزبون
        document.getElementById('invoiceDetails').innerHTML = 
            "🆔 <b>معرّف اللاعب (ID):</b> " + id + "<br>" +
            "📦 <b>الباقة المطلوبة:</b> " + packageText + "<br>" +
            "💳 <b>حساب استلام المدفوعات:</b><br>" +
            "👉 <code>" + walletAddress + "</code>";
            
        // تجهيز النص النظيف الذي سيتم نسخه في حافظة الهاتف بدون أكواد HTML
        textToCopy = "🧾 فاتورة طلب شحن جديدة\n" +
                     "🆔 معرّف اللاعب (ID): " + id + "\n" +
                     "📦 الباقة: " + packageText + "\n" +
                     "💳 حساب استلام الأرباح للتحويل: " + walletAddress;

        document.getElementById('invoiceBox').style.display = 'block';
    }

    // دالة النسخ التلقائي بضغطة زر واحدة
    function copyInvoiceText() {
        if (!textToCopy) return;
        
        navigator.clipboard.writeText(textToCopy).then(function() {
            alert("✅ تم نسخ تفاصيل الفاتورة بنجاح! الصقها الآن في شات البوت وأرسلها مع صورة التحويل.");
        }).catch(function(err) {
            // حل بديل للهواتف القديمة في حال لم تدعم الحافظة المباشرة
            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            alert("✅ تم نسخ تفاصيل الفاتورة بنجاح! الصقها الآن في شات البوت وأرسلها مع صورة التحويل.");
        });
    }
</script>

</body>
</html>
