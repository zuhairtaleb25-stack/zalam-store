<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن جواهر فري فاير</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; text-align: center; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #c0392b; }
        .invoice-box { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💎 متجر شحن فري فاير المباشر</h2>
    <p>أدخل بياناتك واختر باقة الجواهر لإرسال طلب الدفع</p>

    <div class="input-group">
        <label for="playerId">معرّف اللاعب (Player ID):</label>
        <input type="number" id="playerId" placeholder="أدخل الـ ID الخاص بك هنا" required>
    </div>

    <div class="input-group">
        <label for="serviceSelect">اختر باقة الجواهر:</label>
        <select id="serviceSelect">
            <option value="💎 110 جوهرة بسعر 1.20\$ 🟢">💎 110 جوهرة (\$1.20)</option>
            <option value="💎 231 جوهرة بسعر 2.40\$ 🟢">💎 231 جوهرة (\$2.40)</option>
            <option value="💎 583 جوهرة بسعر 5.50\$ 🟢">💎 583 جوهرة (\$5.50)</option>
            <option value="💎 1188 جوهرة بسعر 10.90\$ 🟢">💎 1188 جوهرة (\$10.90)</option>
            <option value="💎 2420 جوهرة بسعر 21.50\$ 🟢">💎 2420 جوهرة (\$21.50)</option>
        </select>
    </div>

    <button class="btn-submit" id="btnBuy">📦 تأكيد الطلب وعرض الفاتورة</button>

    <!-- صندوق عرض الفاتورة الفوري لتخطي حظر تليجرام -->
    <div id="invoiceBox" class="invoice-box">
        <h3 style="text-align:center; margin-top:0;">🧾 فاتورة الدفع الفورية</h3>
        <p id="invoiceDetails"></p>
        <hr>
        <p style="color:#c0392b; font-weight:bold; text-align:center;">يرجى نسخ تفاصيل الفاتورة أعلاه وإرسالها في الشات للبوت مع صورة التحويل لإتمام الشحن فوراً!</p>
        <button class="btn-submit" style="background-color:#2ecc71;" id="btnClose">닫기 إغلاق المتجر والتحويل للتحويل</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('btnBuy').addEventListener('click', () => {
        const playerId = document.getElementById('playerId').value.trim();
        const serviceText = document.getElementById('serviceSelect').value;

        if (!playerId) {
            tg.showAlert('الرجاء إدخال معرّف اللاعب (ID) أولاً!');
            return;
        }

        // عرض تفاصيل الفاتورة مباشرة للزبون بداخل شاشة المتجر لتجنب الحظر التقني
        const invoiceDetails = `🆔 <b>معرّف اللاعب (ID):</b> ${playerId}<br>📦 <b>الباقة المطلوبة:</b> ${serviceText}<br>💳 <b>حساب الكاش لتحويل الأموال:</b> <br>👉 <code>07xxxxxxxx</code> (زين كاش / فودافون كاش)`;
        
        document.getElementById('invoiceDetails').innerHTML = invoiceDetails;
        document.getElementById('invoiceBox').style.display = 'block';
    });

    document.getElementById('btnClose').addEventListener('click', () => {
        tg.close(); // إغلاق المتجر بعد رؤية العميل للفاتورة
    });
</script>

</body>
</html>
